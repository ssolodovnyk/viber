<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Відкрити Messenger</title>
<style>
  :root { --brand:#0866ff; --fg:#ffffff; --soft:rgba(255,255,255,.16); }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  /* Уся сторінка — одна кнопка: дотик будь-де копіює текст і відкриває Messenger */
  a.all { display:flex; flex-direction:column; justify-content:center; gap:18px; min-height:100%;
          background:var(--brand); color:var(--fg); text-decoration:none; padding:32px 20px;
          font:17px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  .big { font-size:26px; font-weight:800; text-align:center; }
  .who { font-size:18px; text-align:center; }
  .msg { white-space:pre-wrap; background:var(--soft); border-radius:12px; padding:12px 14px; font-size:15px; }
  .hint { font-size:14px; text-align:center; opacity:.85; }
</style>
</head>
<body>
<a class="all" id="go" href="https://m.me/">
  <div class="big">Торкніться — відкрити Messenger</div>
  <div class="who" id="who" hidden>Кому: <b id="name"></b></div>
  <div class="msg" id="msg" hidden></div>
  <div class="hint">Текст скопіюється. У Messenger: оберіть людину → утримайте поле вводу → «Вставити».</div>
</a>
<script>
  // Data comes only in the part after "#": browsers never send it to the server.
  // Format: #n=<ім'я клієнта>&t=<url-encoded text>
  // https://m.me/ віддається застосунку Messenger лише при дотику всередині браузера (перевірено на Android власника).
  var p = new URLSearchParams(location.hash.slice(1));
  var n = p.get('n') || '';
  var t = p.get('t') || '';
  if (n) { document.getElementById('name').textContent = n; document.getElementById('who').hidden = false; }
  if (t) {
    var msg = document.getElementById('msg'); msg.textContent = t; msg.hidden = false;
    document.getElementById('go').addEventListener('click', function () {
      try { navigator.clipboard.writeText(t).catch(function(){}); } catch (e) {}
    });
  }
</script>
</body>
</html>
